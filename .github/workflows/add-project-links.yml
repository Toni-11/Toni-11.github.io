name: Add project links UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-portfolio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update index.html
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = r'''
          /* ===== PROJECT RESOURCES ===== */
          .project-resource-actions{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:12px;
            flex-wrap:wrap;
            margin:0 auto 42px;
          }
          .resource-btn{
            padding:11px 20px;
            border-radius:50px;
            border:1px solid var(--border-glass);
            background:var(--bg-card);
            color:var(--text-main);
            font-size:0.84rem;
            font-weight:600;
            display:inline-flex;
            align-items:center;
            gap:9px;
            cursor:pointer;
            transition:0.3s;
          }
          .resource-btn:hover{transform:translateY(-3px);border-color:var(--primary);background:rgba(255,255,255,0.06);}
          .resource-btn.primary{background:var(--gradient-main);color:#04060f;border-color:transparent;}
          .resource-btn.primary:hover{box-shadow:0 10px 28px rgba(0,217,255,0.22);}
          .presentation-modal{
            position:fixed;
            inset:0;
            z-index:6000;
            display:none;
            align-items:center;
            justify-content:center;
            padding:24px;
            background:rgba(4,6,15,0.88);
            backdrop-filter:blur(10px);
            opacity:0;
            transition:opacity .25s ease;
          }
          .presentation-modal.active{display:flex;opacity:1;}
          .presentation-modal-content{
            width:min(720px,100%);
            max-height:82vh;
            overflow:auto;
            background:var(--bg-card);
            border:1px solid var(--border-glass);
            border-radius:var(--radius);
            padding:30px;
            box-shadow:0 25px 70px rgba(0,0,0,.45);
            position:relative;
          }
          .presentation-modal-content h3{color:var(--primary);margin-bottom:8px;font-size:1.35rem;}
          .presentation-modal-content p{color:var(--text-muted);font-size:.84rem;margin-bottom:22px;}
          .presentation-list{display:grid;gap:12px;}
          .presentation-item{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:14px;
            padding:15px 16px;
            border:1px solid var(--border-glass);
            border-radius:12px;
            background:rgba(255,255,255,.03);
          }
          .presentation-item span{font-size:.86rem;color:var(--text-main);}
          .presentation-item a{flex-shrink:0;color:var(--primary);font-size:.78rem;font-weight:600;}
          .presentation-item a:hover{color:var(--accent);}
          .presentation-modal-close{
            position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;
            border:1px solid var(--border-glass);background:var(--gradient-main);color:#04060f;
            display:flex;align-items:center;justify-content:center;cursor:pointer;
          }
          @media(max-width:600px){
            .presentation-modal-content{padding:24px 18px;}
            .presentation-item{align-items:flex-start;flex-direction:column;}
          }
          '''

          marker = '</style>'
          if '/* ===== PROJECT RESOURCES ===== */' not in html:
              html = html.replace(marker, css + '\n' + marker, 1)

          filter_block = '''    <div class="filter-bar" data-aos="fade-up">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="ml">Machine Learning</button>
      <button class="filter-btn" data-filter="data">Data Analytics</button>
      <button class="filter-btn" data-filter="se">Software Engineering</button>
      <button class="filter-btn" data-filter="prog">Programming</button>
    </div>'''

          resources = '''

    <div class="project-resource-actions" data-aos="fade-up">
      <a href="https://github.com/Toni-11?tab=repositories" target="_blank" rel="noopener noreferrer" class="resource-btn">
        <i class="fa-solid fa-folder-open"></i> View Project Files
      </a>
      <button type="button" class="resource-btn primary" onclick="openPresentations()">
        <i class="fa-solid fa-file-powerpoint"></i> View All Presentations
      </button>
    </div>'''

          if 'class="project-resource-actions"' not in html and filter_block in html:
              html = html.replace(filter_block, filter_block + resources, 1)

          modal = '''

<!-- ================= ALL PRESENTATIONS MODAL ================= -->
<div class="presentation-modal" id="presentationModal" aria-hidden="true">
  <div class="presentation-modal-content">
    <button class="presentation-modal-close" type="button" onclick="closePresentations()" aria-label="Close presentations">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <h3><i class="fa-solid fa-file-powerpoint"></i> Project Presentations</h3>
    <p>Open the original presentation files associated with the projects.</p>
    <div class="presentation-list">
      <div class="presentation-item"><span>ATM Machine Simulation</span><a href="https://drive.google.com/file/d/1O1jNFkUqcgkDqgngGAC1rkmVyBG936gZ/view?usp=sharing" target="_blank" rel="noopener noreferrer">Open File <i class="fa-solid fa-arrow-up-right-from-square"></i></a></div>
      <div class="presentation-item"><span>Number Guessing Game</span><a href="https://drive.google.com/file/d/1QdsI4xPcmKTuGfZ814gw6QGUeshkolRT/view?usp=drive_link" target="_blank" rel="noopener noreferrer">Open File <i class="fa-solid fa-arrow-up-right-from-square"></i></a></div>
      <div class="presentation-item"><span>Calories Calculator</span><a href="https://drive.google.com/file/d/1O92O54Hxxn2vW3ch7k4mbxetXSLenywi/view?usp=drive_link" target="_blank" rel="noopener noreferrer">Open File <i class="fa-solid fa-arrow-up-right-from-square"></i></a></div>
      <div class="presentation-item"><span>Project Presentation 4</span><a href="https://docs.google.com/presentation/d/1_keNszEJPv7JLGxq2cWZROUodYAulYrJ/edit?usp=sharing&ouid=111256448287748413415&rtpof=true&sd=true" target="_blank" rel="noopener noreferrer">Open File <i class="fa-solid fa-arrow-up-right-from-square"></i></a></div>
      <div class="presentation-item"><span>Project Presentation 5</span><a href="https://docs.google.com/presentation/d/10o19_L6-HlmIYXUH14GZz6eU5CLoPf2g/edit?usp=sharing&ouid=111256448287748413415&rtpof=true&sd=true" target="_blank" rel="noopener noreferrer">Open File <i class="fa-solid fa-arrow-up-right-from-square"></i></a></div>
    </div>
  </div>
</div>'''

          if 'id="presentationModal"' not in html:
              html = html.replace('<!-- ================= LIGHTBOX MODAL ================= -->', modal + '\n\n<!-- ================= LIGHTBOX MODAL ================= -->', 1)

          js = '''

/* ===== PROJECT PRESENTATIONS MODAL ===== */
function openPresentations(){
  const modal = document.getElementById('presentationModal');
  if(!modal) return;
  modal.classList.add('active');
  modal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closePresentations(){
  const modal = document.getElementById('presentationModal');
  if(!modal) return;
  modal.classList.remove('active');
  modal.setAttribute('aria-hidden','true');
  document.body.style.overflow='auto';
}
const presentationModal = document.getElementById('presentationModal');
if(presentationModal){
  presentationModal.addEventListener('click', function(e){
    if(e.target === this) closePresentations();
  });
}
'''

          if 'function openPresentations()' not in html:
              html = html.replace('/* ===== LIGHTBOX FUNCTIONS ===== */', js + '\n/* ===== LIGHTBOX FUNCTIONS ===== */', 1)

          # Add a direct project-files button to the C++ collection card.
          cpp_end = '''        </ul>
      </div>

      <div class="project-card" data-cat="prog" data-aos="fade-up" data-aos-delay="200">'''
          cpp_buttons = '''        </ul>
        <div style="display:flex; gap:12px; margin-top:16px;">
          <a href="https://github.com/Toni-11/cpp-projects" target="_blank" rel="noopener noreferrer" class="btn btn-outline" style="padding:8px 18px; font-size:0.82rem;">
            <i class="fa-brands fa-github"></i> View Project Files
          </a>
        </div>
      </div>

      <div class="project-card" data-cat="prog" data-aos="fade-up" data-aos-delay="200">'''
          if 'https://github.com/Toni-11/cpp-projects' not in html and cpp_end in html:
              html = html.replace(cpp_end, cpp_buttons, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add project files and presentations buttons"
          git push
